<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>IPL Ticket Booking Form</title>

  </head>

  <body>
    <header>
      <section id="booking">
        <h2>Book Your IPL Ticket</h2>

        <form action="#" method="post">
          <!-- Personal Details -->

          <label for="name">Full Name:</label>

          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            minlength="3"
            maxlength="50"
            required
          />

          <br /><br />

          <label for="email">Email Address:</label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="example@gmail.com"
            required
          />

          <br /><br />

          <label for="phone">Phone Number:</label>

          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter 10-digit phone number"
            pattern="[0-9]{10}"
            maxlength="10"
            required
          />

          <br /><br />

          <!-- Match Selection -->

          <label for="match">Select Match:</label>

          <select id="match" name="match" required>
            <option value="">-- Select a Match --</option>

            <option value="RCB-CSK">RCB vs CSK</option>

            <option value="MI-CSK">MI vs CSK</option>

            <option value="KKR-SRH">KKR vs SRH</option>
          </select>

          <br /><br />

          <!-- Stand Category -->

          <label for="stand">Select Stand Category:</label>

          <select id="stand" name="stand" required>
            <option value="">-- Select Stand --</option>

            <option value="General">General</option>

            <option value="Premium">Premium</option>

            <option value="VIP">VIP</option>
          </select>

          <br /><br />

          <!-- Ticket Quantity -->

          <label for="quantity">Number of Tickets:</label>

          <input
            type="number"
            id="quantity"
            name="quantity"
            min="1"
            max="10"
            required
          />

          <br /><br />

          <!-- Booking Preference -->

          <p>Additional Preferences:</p>

          <input
            type="radio"
            id="online"
            name="payment"
            value="online"
            required
          />

          <label for="online">Online Payment</label>

          <input type="radio" id="counter" name="payment" value="counter" />

          <label for="counter">Stadium Counter</label>

          <br /><br />

          <input type="checkbox" id="terms" name="terms" required />

          <label for="terms"> I agree to the booking guidelines. </label>

          <br /><br />

          <!-- Form Buttons -->

          <button type="submit">Submit Booking</button>

          <button type="reset">Reset Form</button>
        </form>
      </section>
      <h1>IPL Ticket Booking</h1>

      <nav>
        <a href="index/index.html">Home</a>
        <a href="#booking">Book Ticket</a>
      </nav>
    </header>
  </body>
</html>
